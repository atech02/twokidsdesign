# ==============================================================================
# TWO KIDS DESIGN — NETLIFY BACKEND SERVERLESS CONFIGURATION
# ==============================================================================

[build]
  functions = "netlify/functions"

# Secrets scanning configuration: exempt public URLs and server config keys from scanner false-positives
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "DOWNLOAD_TOKEN_SECRET,LIPILA_BASE_URL,LIPILA_CALLBACK_URL,LIPILA_ENV"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,render.yaml,tests/**,server/**"

# Seamlessly rewrite all /api/* requests to the Netlify API Function
# Ensures frontend calls ${API_BASE_URL}/api/... without duplicate path segments
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client-side SPA routing fallback for React Router (/checkout, /order-confirmation, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Global CORS headers across all API endpoints
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS, PUT, DELETE"
    Access-Control-Allow-Headers = "Content-Type, Authorization, x-api-key, accept"
    Access-Control-Max-Age = "86400"
